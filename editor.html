<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人主页内容编辑器 | Yang Wu</title>
<style>
:root {--ink:#20262d;--muted:#6a7480;--line:#dfe4e9;--blue:#244d77;--pale:#f6f8fa}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Microsoft YaHei",sans-serif;background:#fff;color:var(--ink);margin:0;line-height:1.55;font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer}a{color:var(--blue)}
.shell{max-width:1120px;margin:0 auto;padding:24px 28px 72px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px}h1{font-size:22px;margin:0 0 5px;letter-spacing:-.4px}p.lead{color:var(--muted);margin:0;font-size:13px}h2{font-size:19px;margin:0 0 7px}h3{font-size:15px;margin:0 0 12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:white;color:var(--blue);padding:9px 13px;border-radius:5px;font-size:13px;font-weight:600}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:#a33c38}.btn:focus-visible{outline:2px solid #5c92c4;outline-offset:2px}.status{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:30px}aside{align-self:start;position:sticky;top:20px}.tab{display:block;width:100%;text-align:left;border:0;background:transparent;color:#56616d;border-left:3px solid transparent;padding:9px 12px;font-size:13.5px}.tab:hover{background:var(--pale)}.tab.active{color:var(--blue);font-weight:700;background:var(--pale);border-left-color:var(--blue)}.content{min-width:0}.desc{font-size:13px;color:var(--muted);margin-bottom:18px}
.form-item{border-top:1px solid #eceff1;padding:16px 0}.form-item:first-of-type{border-top:0}.field-title{display:block;font-size:13px;font-weight:650;color:#273340;margin-bottom:9px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:13px}.sub-label{display:block;font-size:11px;color:#677380;margin:0 0 5px;font-weight:650;letter-spacing:.01em}input[type=text],input[type=url],input[type=number],textarea{width:100%;border:1px solid #d9dfe5;border-radius:4px;background:#fff;color:#20262d;padding:9px 10px;outline:0;font-size:13px}textarea{resize:vertical;min-height:64px;line-height:1.5}input:focus,textarea:focus{border-color:#658bb0;box-shadow:0 0 0 2px #dce9f5}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.group-card{border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;background:white}.group-card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.group-card-header strong{font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:6px}.mini{background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;color:#536678;font-size:12px}.mini:hover{background:#f7fafc}.inline-check{display:flex;align-items:center;gap:7px;color:#455464;font-size:13px}.helper{font-size:12px;color:var(--muted);margin:7px 0 0}.notice{background:#f7f9fb;border:1px solid #e5e9ee;border-radius:5px;padding:12px 14px;margin:12px 0 20px;font-size:12.5px;color:#4c5b68}.add-row{padding-top:9px}.footer-note{border-top:1px solid var(--line);margin-top:22px;padding-top:13px;color:#78818a;font-size:12px}
@media(max-width:750px){.shell{padding:16px}.layout{grid-template-columns:1fr;gap:16px}aside{position:static;display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}.tab{width:auto;border-left:0;border-bottom:2px solid transparent;padding:7px 10px}.tab.active{border-left:0;border-bottom-color:var(--blue)}.pair,.field-grid{grid-template-columns:1fr}header{align-items:flex-start}}
</style>
</head>
<body>
<div class="shell">
<header>
 <div><h1>个人主页内容编辑器</h1><p class="lead">编辑中英文文案、发表论文和团队成员，不需要修改 HTML</p></div>
 <div class="toolbar"><span id="status" class="status">未修改</span><button id="download" type="button" class="btn primary">下载 site-data.js</button></div>
</header>
<div class="notice">这个编辑器在你的浏览器本地运行，不会自动修改 GitHub 仓库。编辑完成后，点击右上角下载 <strong>site-data.js</strong>，再用它替换 GitHub 仓库里的同名文件。不要上传私人信息或密码。</div>
<div class="layout">
 <aside id="tabs" aria-label="编辑栏目"></aside>
 <main class="content" id="pane"></main>
</div>
<div class="footer-note">建议将 editor.html、site-data.js 放在电脑同一文件夹。编辑器可以离线打开。GitHub Pages 只需要上传 index.html 和 site-data.js。</div>
</div>
<script src="site-data.js"></script>
<script>
(() => {
 'use strict';
 if(!window.SITE_DATA) {document.querySelector('#pane').textContent='缺少 site-data.js。请把 editor.html 和 site-data.js 放在同一个文件夹再打开。';document.querySelector('#download').disabled=true;return;}
 const D=JSON.parse(JSON.stringify(window.SITE_DATA));
 let dirty=false;
 let current='basic';
 const tabs=[['basic','基本信息'],['home','主页介绍'],['research','研究方向'],['publications','论文成果'],['people','团队成员'],['group','团队介绍'],['join','合作与招聘'],['other','导航与其他']];
 const $=sel=>document.querySelector(sel);
 const el=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x;};
 const mark=()=>{dirty=true;$('#status').textContent='有尚未导出的修改';};
 const bindInput=(parent,label,value,change,type='text',span=false)=>{
  const wrap=el('div',span?'form-item':'');
  const l=el('label','sub-label',label);wrap.append(l);
  const input=type==='textarea'?el('textarea'):el('input');
  if(type!=='textarea')input.type=type;
  input.value=value??'';
  l.append(input);
  input.addEventListener('input',()=>{change(type==='number'? Number(input.value):input.value);mark();});
  parent.append(wrap);return input;
 };
 const line=(parent,a,b)=>{const d=el('div','field-grid');parent.append(d);return d;};
 function title(heading,detail){const h=el('h2',null,heading);const p=el('p','desc',detail);$('#pane').append(h,p);}
 function renderBasic(){
  title('基本信息','姓名、邮箱、照片及外部学术主页链接。照片文件（如 avatar.jpg）需要另外上传到仓库。');
  const fields=[['name','英文姓名','text'],['nameZh','中文姓名','text'],['email','邮箱','text'],['portrait','照片文件名 / 相对路径','text'],['scholarUrl','Google Scholar 链接','url'],['githubUrl','GitHub 个人主页链接','url'],['cvUrl','CV 文件或 URL（请使用 https 链接）','url']];
  fields.forEach(([key,label,type])=>{const w=el('div','form-item');bindInput(w,label,D.profile[key],v=>D.profile[key]=v,type);$('#pane').append(w);});
  const w=el('div','form-item');bindInput(w,'其他论文默认显示条数',D.settings.otherInitiallyVisible,v=>D.settings.otherInitiallyVisible=Math.max(0,v||0),'number');$('#pane').append(w);
 }
 const groups={
  home:['home.','contact.'],research:['research.'],group:['group.'],join:['join.'],other:['nav.','publications.','footer.']
 };
 function renderTexts(tab){
  const descs={home:['主页介绍','包括 Home 页上的简介、研究团队摘要、合作招聘摘要和联系方式。'],research:['研究方向','这里的描述会出现在 Home 页。团队详情的方向描述在「团队介绍」栏目修改。'],group:['团队介绍','包含团队详情页上的研究目标、研究理念和介绍文字。成员的姓名和角色请在「团队成员」栏目修改。'],join:['合作与招聘','修改合作与实习的说明。不要承诺未经确认的实习薪酬、名额或时长。'],other:['导航与其他文字','包括顶部导航、论文标题、页脚更新说明等。']};
  title(...descs[tab]);
  const keys=Object.keys(D.texts).filter(k=>groups[tab].some(p=>k.startsWith(p)));
  keys.forEach(key=>{
   const value=D.texts[key]; const w=el('div','form-item');
   w.append(el('div','field-title',key));
   const pair=el('div','pair');
   bindInput(pair,'English',value.en,v=>D.texts[key].en=v,value.en.length>65?'textarea':'text');
   bindInput(pair,'中文',value.zh,v=>D.texts[key].zh=v,value.zh.length>40?'textarea':'text');
   w.append(pair);$('#pane').append(w);
  });
 }
 function itemButtons(holder,list,index){
  const actions=el('div','actions');
  [['↑',()=>{if(index>0)[list[index-1],list[index]]=[list[index],list[index-1]];}],['↓',()=>{if(index<list.length-1)[list[index],list[index+1]]=[list[index+1],list[index]];}],['删除',()=>{if(!confirm('删除这一条？'))return;list.splice(index,1);}]].forEach(([text,doIt])=>{
   const button=el('button','mini',text);button.type='button';button.addEventListener('click',()=>{doIt();mark();renderPane();});actions.append(button);
  });holder.append(actions);
 }
 function renderPubs(){
  title('论文成果','选中「代表成果」的论文会在 Selected Publications 栏目显示；其他论文进入 Other Publications，数量超过默认值会出现展开按钮。');
  D.publications.forEach((p,i)=>{
   const card=el('section','group-card');const head=el('div','group-card-header');head.append(el('strong',null,`论文 ${i+1} · ${p.year||'年份待定'}`));itemButtons(head,D.publications,i);card.append(head);
   const grid=el('div','field-grid');
   bindInput(grid,'年份',p.year,v=>p.year=v);
   const ck=el('label','inline-check');const cb=el('input');cb.type='checkbox';cb.checked=!!p.selected;cb.addEventListener('change',()=>{p.selected=cb.checked;mark();});ck.append(cb,document.createTextNode('代表成果（Selected）'));grid.append(ck);card.append(grid);
   [['title','论文题名','textarea'],['authors','作者（用英文逗号分隔）','text'],['venue','会议 / 期刊','text'],['paperUrl','Paper / DOI 链接','url'],['pdfUrl','PDF 链接（可选）','url'],['codeUrl','Code 链接（可选）','url']].forEach(([field,label,type])=>{const w=el('div','form-item');bindInput(w,label,p[field],v=>p[field]=v,type);card.append(w);});
   $('#pane').append(card);
  });
  const button=el('button','btn','+ 添加一篇论文');button.type='button';button.addEventListener('click',()=>{D.publications.push({year:String(new Date().getFullYear()),title:'',authors:'',venue:'',selected:false,paperUrl:'',pdfUrl:'',codeUrl:''});mark();renderPane();});const addRow=el('div','add-row');addRow.append(button);$('#pane').append(addRow);
 }
 function renderPeople(){
  title('团队成员','每个成员可以填写中英文名字、角色与简介。默认是「指导教师 + 四名学生研究者」，可以修改或增删。');
  D.people.forEach((p,i)=>{
   const card=el('section','group-card');const head=el('div','group-card-header');head.append(el('strong',null,`成员 ${i+1} · ${p.name||'待填写'}`));itemButtons(head,D.people,i);card.append(head);
   const g=el('div','field-grid');bindInput(g,'英文姓名',p.name,v=>p.name=v);bindInput(g,'中文姓名',p.nameZh,v=>p.nameZh=v);card.append(g);
   const g2=el('div','pair');bindInput(g2,'Role (English)',p.role?.en,v=>p.role.en=v);bindInput(g2,'角色（中文）',p.role?.zh,v=>p.role.zh=v);card.append(g2);
   const g3=el('div','pair');bindInput(g3,'Description (English)',p.detail?.en,v=>p.detail.en=v,'textarea');bindInput(g3,'简介（中文）',p.detail?.zh,v=>p.detail.zh=v,'textarea');card.append(g3);
   bindInput(card,'个人链接（可选）',p.url||'',v=>p.url=v,'url');$('#pane').append(card);
  });
  const button=el('button','btn','+ 添加成员');button.type='button';button.addEventListener('click',()=>{D.people.push({name:'',nameZh:'',role:{en:'Student Researcher',zh:'学生研究成员'},detail:{en:'',zh:''},url:''});mark();renderPane();});$('#pane').append(button);
 }
 function renderPane(){const box=$('#pane');box.replaceChildren();if(current==='basic')renderBasic();else if(current==='publications')renderPubs();else if(current==='people')renderPeople();else renderTexts(current);}
 function renderTabs(){const root=$('#tabs');tabs.forEach(([id,label])=>{const b=el('button','tab',label);b.type='button';b.dataset.tab=id;b.addEventListener('click',()=>{current=id;root.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));renderPane();});root.append(b);});root.firstChild.classList.add('active');}
 function exportData(){const data='/* Site content exported from editor.html */\nwindow.SITE_DATA = '+JSON.stringify(D,null,2)+';\n';const blob=new Blob([data],{type:'text/javascript;charset=utf-8'});const url=URL.createObjectURL(blob);const a=el('a');a.href=url;a.download='site-data.js';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);dirty=false;$('#status').textContent='已导出（需要上传 GitHub 才生效）';}
 $('#download').addEventListener('click',exportData);
 window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
 renderTabs();renderPane();
})();
</script>
</body>
</html>
